<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lifecycle Theater: a React hooks game</title>
<style>
:root{--bg:#1d0f2b;--panel:#2d1844;--ink:#f6ecd9;--mute:#b9a6cc;--brass:#f0b84a;--on:#2a1236;--ok:#5fd39a;--bad:#ff7a8a;--code:#170a22;--line:#4a2d6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f4ecf7;--panel:#fff;--ink:#2a1236;--mute:#6d5782;--brass:#d99a1c;--on:#2a1236;--ok:#14804f;--bad:#c4263e;--code:#f1e7f6;--line:#d9c7e6}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.curtain{position:fixed;top:0;bottom:0;width:50%;z-index:30;transition:transform 1.4s cubic-bezier(.7,0,.2,1);background:repeating-linear-gradient(90deg,#7a1530 0 22px,#5c0f25 22px 44px,#8c1a38 44px 60px)}
.curtain.l{left:0;transform-origin:left;box-shadow:inset -30px 0 40px #0006}.curtain.r{right:0;box-shadow:inset 30px 0 40px #0006}
body.open .l{transform:translateX(-102%)}body.open .r{transform:translateX(102%)}
#start{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:24px;transition:opacity .5s}
body.open #start{opacity:0;pointer-events:none}
#start .card{background:#1d0f2bdd;color:#f6ecd9;border:2px solid var(--brass);border-radius:14px;padding:28px 24px;max-width:460px}
#start h1{font-size:clamp(2rem,8vw,3rem);margin:0 0 8px;color:var(--brass)}
#start p{margin:8px 0 18px;color:#e6d8f0}
.go{background:var(--brass);color:var(--on);border:0;border-radius:10px;padding:12px 22px;font-weight:700;transition:transform .15s}
.go:hover{transform:translateY(-2px)}
main{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.top .t{font-size:1.15rem;margin-right:auto;color:var(--brass)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:600}
.pills{display:flex;gap:6px;margin:6px 0}.pills i{flex:1;height:8px;border-radius:4px;background:var(--line);transition:background .4s}
.pills i.d{background:var(--ok)}.pills i.c{background:var(--brass)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}.bar b{display:block;height:100%;background:var(--brass);transition:width .5s}
#stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative}
.lv{font-weight:700;color:var(--brass)}.story{color:var(--mute);margin:2px 0 14px;font-size:.95rem}
h2{font-size:1.25rem;margin:0 0 12px}
pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:0 0 14px;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.opts{display:grid;gap:10px}
.opt,.ln,.chip{background:transparent;border:2px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left;transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not(:disabled),.chip:hover:not(:disabled),.ln:hover:not(:disabled){border-color:var(--brass);transform:translateX(3px)}
.opt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.ln{display:block;width:100%;border-radius:0;border-width:0 0 0 4px;padding:2px 10px;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow-x:auto}
.codeb{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 0;margin-bottom:14px}
.ok{border-color:var(--ok)!important;background:#5fd39a26!important}.no{border-color:var(--bad)!important;background:#ff7a8a26!important;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip b{display:inline-block;min-width:1.4em;color:var(--ok)}
input[type=text]{width:100%;background:var(--code);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:15px ui-monospace,Menlo,Consolas,monospace;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.ghost{background:transparent;border:1px dashed var(--mute);border-radius:8px;padding:6px 12px;color:var(--mute)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:5px solid;animation:pop .35s}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.hint{color:var(--brass);margin-top:10px;font-size:.95rem}
@keyframes pop{from{transform:scale(.96);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .35s}
#log{background:var(--code);border-radius:10px;min-height:110px;max-height:190px;overflow:auto;padding:10px;font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;margin-top:12px}
#log div{animation:pop .3s}.cu{color:var(--bad)}.ef{color:var(--ok)}.rn{color:var(--mute)}
.stars{font-size:3rem;letter-spacing:6px;color:var(--brass)}
.fin ul{padding-left:20px}.fin li{margin:6px 0}
.p{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div class="curtain l"></div><div class="curtain r"></div>
<div id="start"><div class="card"><h1 class="serif">Lifecycle Theater</h1>
<p>Every React component is an actor: it enters, performs, and exits. You’re the stage manager. Clear 6 levels of hooks, dependency arrays and real interview bugs.</p>
<button class="go" id="begin">Raise the curtain</button></div></div>
<main>
<div class="top"><span class="t serif">Lifecycle Theater</span><span class="stat" id="sc">0 pts</span><span class="stat" id="st">Streak 0</span></div>
<div class="pills" id="pills"></div><div class="bar"><b id="pr" style="width:0"></b></div>
<section id="stage" aria-live="polite"></section>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const LV=[
{n:'Rehearsal',s:'Backstage. A Radio actor tunes in when it enters and tunes out when it leaves. Press all three buttons to see what React runs.',qs:[{t:'sim'}]},
{n:'Curtain Call Order',s:'Cues fired in the wrong order ruin the show. Tap the steps in the order React runs them.',qs:[
{t:'order',q:'The channel prop changes on a mounted component with useEffect(…, [channel]). Tap the steps in order.',items:['Component re-renders with the new prop','React updates the DOM','Old effect’s cleanup runs','New effect runs'],x:'React renders and updates the DOM first, then cleans up the previous effect (with its old values), then runs the new one. Cleanup always comes before the next effect.',w:'Not yet. Render comes first and effects come last.',h:'Render first, effects last, cleanup right before the new effect.'},
{t:'order',q:'A component mounts, lives a while, then is removed. Tap the order.',items:['Render returns JSX','DOM nodes are created','Effect runs after paint','Cleanup runs on unmount'],x:'Render, commit to the DOM, then effects run after paint. On removal only cleanup runs, so it is where you stop timers and close sockets.',w:'Not that one yet. Think: build it, show it, then side effects.',h:'Effects run after the screen is updated.'}]},
{n:'Pick the Hook',s:'A tour group needs five different jobs done. Choose the right tool for each.',qs:[
{t:'choice',q:'The profile page opens and you must fetch the user once, when it first appears.',o:['useEffect(() => { fetchUser() }, [])','useEffect(() => { fetchUser() })','useMemo(() => fetchUser(), [])','useRef(fetchUser())'],a:0,x:'An empty dependency array means “run after the first render only”, the hook version of componentDidMount. With no array it would refetch after every render.',w:'No array means the effect runs after every render. useMemo and useRef are for values, not side effects.',h:'Fetching is a side effect. Which array runs once?'},
{t:'choice',q:'Where do you do what componentWillUnmount did: stop a timer, close a socket?',o:['In the function returned from useEffect','At the top of the component body','In a second useState','Inside useMemo'],a:0,x:'The function you return from an effect is its cleanup. React calls it before the next effect and when the component unmounts.',w:'Code in the body runs on every render. Cleanup must be returned from the effect.',h:'Think of the word “return”.'},
{t:'choice',q:'A tooltip paints in the wrong spot and then jumps. You must measure it before the browser paints.',o:['useEffect','useLayoutEffect','useCallback','useReducer'],a:1,x:'useLayoutEffect runs synchronously after DOM updates but before paint, so you can measure and adjust with no flicker. Use it sparingly because it blocks painting.',w:'useEffect runs after paint, which is exactly why you saw the jump.',h:'One hook runs before the browser paints.'},
{t:'choice',q:'You must keep a setInterval id between renders without re-rendering when it changes.',o:['useState','useRef','A plain let variable','useMemo'],a:1,x:'useRef is a mutable box that survives renders, and changing ref.current does not re-render. A plain let is recreated on every render.',w:'useState re-renders on each change, and a plain variable resets every render.',h:'A box that survives renders, silently.'}]},
{n:'Dependency Array',s:'The prompter reads the cue list. Wrong list, wrong show.',qs:[
{t:'choice',q:'Which dependency array is correct?',code:'useEffect(() => {\n  fetchUser(userId).then(setUser);\n}, [ ??? ]);',o:['[]','[userId]','[user]','no array'],a:1,x:'List every reactive value the effect reads. When userId changes the effect re-runs and fetches the new user. [] would keep showing stale data.',w:'[] never refetches, and [user] loops because the effect sets user.',h:'Which prop or state does the effect read?'},
{t:'choice',q:'What happens here?',code:'const [n, setN] = useState(0);\nuseEffect(() => {\n  setN(n + 1);\n});',o:['Runs once','Infinite render loop','Never runs','Runs on unmount only'],a:1,x:'No array means run after every render. setN causes a render, which runs the effect, which sets state again, forever.',w:'With no array, the render it triggers runs the effect again.',h:'Does setN cause a render? Then what runs again?'},
{t:'choice',q:'Attach a resize listener once and remove it on unmount. Pick the array.',code:'useEffect(() => {\n  window.addEventListener("resize", onResize);\n  return () => window.removeEventListener("resize", onResize);\n}, [ ??? ]);',o:['[]','[width]','no array','[onResize, width]'],a:0,x:'Subscribe once, clean up once: []. If onResize is defined inside the component, wrap it in useCallback or move it into the effect.',w:'Extra dependencies would remove and re-add the listener on every change.',h:'Once on mount, once on unmount.'}]},
{n:'Bug Hunt',s:'Interview day. The reviewer slides over code with one bug. Tap the guilty line.',qs:[
{t:'bug',q:'The counter sticks at 1 forever. Tap the buggy line.',c:['useEffect(() => {','  const id = setInterval(() => {','    setCount(count + 1);','  }, 1000);','  return () => clearInterval(id);','}, []);'],a:2,x:'Stale closure: with [] the effect captured count = 0 once, so it always sets 1. Fix it with setCount(c => c + 1), which reads the latest state.',w:'That line is fine. Look at what the callback captured on the first render.',h:'The closure remembers count from the first render.'},
{t:'bug',q:'React warns about this effect. Tap the buggy line.',c:['useEffect(async () => {','  const res = await fetch(url);','  setData(await res.json());','}, [url]);'],a:0,x:'An effect may return nothing or a cleanup function. An async function returns a Promise. Define an async function inside the effect and call it.',w:'Not that line. What does an async function always return?',h:'Effects may only return a cleanup function.'},
{t:'bug',q:'“Rendered more hooks than during the previous render.” Tap the culprit.',c:['function Panel({ user }) {','  if (!user) return null;','  const [open, setOpen] = useState(false);','  return <Toggle open={open} />;','}'],a:1,x:'Hooks must run in the same order every render. The early return skips useState on some renders. Call hooks first, then return early.',w:'Hooks themselves are fine. Look for what can skip them.',h:'Which line can stop later hooks from running?'}]},
{n:'Type It',s:'The prompter is sick and you must fill in the lines yourself. Type the answer, then press Check.',qs:[
{t:'type',q:'Finish the cleanup so the timer stops on unmount. Type what replaces ___ .',code:'useEffect(() => {\n  const id = setInterval(tick, 1000);\n  return () => ___;\n}, []);',re:/^clearInterval\(\s*id\s*\);?$/,x:'clearInterval(id) cancels the timer. Without it the interval keeps firing after unmount, a classic memory leak.',w:'Use the function that cancels setInterval and pass it the id.',h:'clear + Interval + (id)'},
{t:'type',q:'Fix the stale closure with a functional update. Type the full call using c as the argument.',code:'// add 1 to the latest count',re:/^setCount\(\s*\(?\s*(\w+)\s*\)?\s*=>\s*\1\s*\+\s*1\s*\);?$/,x:'setCount(c => c + 1) receives the latest state, so it works even inside an effect with [].',w:'Pass setCount an arrow function: c => c + 1.',h:'setCount( c => ... )'},
{t:'type',q:'Which hook memoizes a function so child props stay stable? Type its name.',re:/^useCallback$/,x:'useCallback returns the same function between renders until its dependencies change, so memoized children avoid re-rendering.',w:'It starts with “use” and ends with the word for what React gives you back.',h:'use + Callback'}]},
{n:'Interview Boss',s:'The final panel. These two get asked in real interviews.',qs:[
{t:'choice',q:'What logs when count changes from 0 to 1?',code:'useEffect(() => {\n  console.log("effect", count);\n  return () => console.log("cleanup", count);\n}, [count]);',o:['effect 0, cleanup 0, effect 1','effect 0, effect 1, cleanup 0','cleanup 0, effect 1','effect 0, cleanup 1, effect 1'],a:0,x:'Mount logs effect 0. On update React runs the old cleanup (still remembering count 0) and then the new effect with 1.',w:'Cleanup sees the values from the render that created it, and runs before the next effect.',h:'Each effect and its cleanup are a pair from the same render.'},
{t:'choice',q:'In development with React 18 StrictMode your mount effect runs twice (effect, cleanup, effect). Why?',o:['A React bug','It simulates unmount and remount to expose missing cleanups','Production does this too','Your dependency array is wrong'],a:1,x:'StrictMode mounts, unmounts and remounts in development to catch effects without cleanup. It never happens in production. Fix the cleanup rather than removing StrictMode.',w:'It is intentional and dev-only.',h:'It is a test React runs on you.'}]}];
const TOT=LV.reduce((a,l)=>a+l.qs.length,0),MAX=(TOT-1)*100+50;
let L=0,Q=0,score=0,streak=0,pts=100,hinted=false,locked=false,answered=0;
const st=$('#stage');
function head(){$('#sc').textContent=score+' pts';$('#st').textContent='Streak '+streak;
$('#pills').innerHTML=LV.map((l,i)=>'<i title="'+l.n+'" class="'+(i<L?'d':i==L?'c':'')+'"></i>').join('');$('#pr').style.width=(answered/TOT*100)+'%'}
function burst(n,fall){const cs=['#f0b84a','#5fd39a','#ff7a8a','#8ab4ff','#f6ecd9'];const r=st.getBoundingClientRect();
for(let i=0;i<n;i++){const e=document.createElement('i');e.className='p';e.style.background=cs[i%5];
const x=fall?Math.random()*innerWidth:r.left+r.width/2,y=fall?-10:r.top+60;e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
const dx=(Math.random()-.5)*(fall?200:380),dy=fall?innerHeight+20:(Math.random()-.8)*260+120;
e.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate('+Math.random()*720+'deg)',opacity:0}],{duration:fall?2600+Math.random()*1500:900+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>e.remove()}}
function shake(){st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake')}
function fb(ok,m){const b=ok?'Nailed it! +'+pts+' pts. ':'Not quite. ';
$('#fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'"><b>'+b+'</b>'+m+'</div>'+(ok?'<div class="row"><button class="go" id="nx">'+(L==LV.length-1&&Q==LV[L].qs.length-1?'Finish the show':'Next')+'</button></div>':'')}
function win(x){if(locked)return;locked=true;score+=pts;streak++;answered++;head();fb(true,x);burst(26);$('#nx').focus();$('#nx').onclick=next;const h=$('#hb');if(h)h.remove()}
function bad(m){pts=Math.max(20,pts-25);streak=0;head();fb(false,m+' (Next try is worth '+pts+' pts.)');shake()}
function next(){Q++;if(Q>=LV[L].qs.length){L++;Q=0}head();L>=LV.length?fin():show()}
function show(){const l=LV[L],q=l.qs[Q];pts=100;hinted=false;locked=false;head();
let h='<div class="lv">Level '+(L+1)+' of '+LV.length+': '+l.n+'</div><p class="story">'+l.s+'</p>';
if(q.t=='sim')return sim(h);
h+='<h2>'+q.q+'</h2>'+(q.code?'<pre>'+esc(q.code)+'</pre>':'');
if(q.t=='choice')h+='<div class="opts">'+q.o.map((t,i)=>'<button class="opt" data-i="'+i+'">'+esc(t)+'</button>').join('')+'</div>';
if(q.t=='bug')h+='<div class="codeb">'+q.c.map((t,i)=>'<button class="ln" data-i="'+i+'">'+esc(t)+'</button>').join('')+'</div>';
if(q.t=='order'){const idx=q.items.map((_,i)=>i).sort(()=>Math.random()-.5);h+='<div class="chips">'+idx.map(i=>'<button class="chip" data-i="'+i+'">'+esc(q.items[i])+'</button>').join('')+'</div>'}
if(q.t=='type')h+='<input type="text" id="in" placeholder="type your answer" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="go" id="ck">Check</button>';
h+='<div id="fb"></div><div class="row"><button class="ghost" id="hb">Need a hint? (−30 pts)</button></div><div id="hn"></div>';
st.innerHTML=h;st.classList.remove('shake');
$('#hb').onclick=()=>{if(!hinted){hinted=true;pts=Math.max(20,pts-30);head()}$('#hn').innerHTML='<p class="hint">Hint: '+q.h+'</p>'};
if(q.t=='choice'||q.t=='bug')st.querySelectorAll('.opt,.ln').forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.i;
if(i==q.a){b.classList.add('ok');win(q.x)}else{b.classList.add('no');b.disabled=true;bad(q.w)}});
if(q.t=='order'){let n=0;st.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(locked||b.disabled)return;
if(+b.dataset.i==n){n++;b.disabled=true;b.classList.add('ok');b.innerHTML='<b>'+n+'</b> '+b.innerHTML;if(n==q.items.length)win(q.x)}else bad(q.w)})}
if(q.t=='type'){const chk=()=>{if(locked)return;const v=$('#in').value.trim();if(q.re.test(v)){$('#in').classList.add('ok');win(q.x)}else bad(q.w)};
$('#ck').onclick=chk;$('#in').onkeydown=e=>{if(e.key=='Enter')chk()};$('#in').focus()}}
function sim(h){let on=false,ch=0,seen=new Set(),done=false;
st.innerHTML=h+'<pre>function Radio({ channel }) {\n  useEffect(() => {\n    tune(channel);                 // effect\n    return () => untune(channel);  // cleanup\n  }, [channel]);\n}</pre><div class="row" style="margin:0"><button class="go" data-a="m">Mount</button><button class="go" data-a="c">Change channel</button><button class="go" data-a="u">Unmount</button><span class="stat" id="state">not on stage</span></div><div id="log"><div class="rn">Press Mount to bring the actor on stage.</div></div><div id="fb"></div>';
const lg=(t,c)=>{const d=document.createElement('div');d.className=c;d.textContent=t;$('#log').appendChild(d);$('#log').scrollTop=1e5};
st.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
if(a=='m'){if(on)return lg('Already mounted. Try Change channel.','rn');on=true;ch=1;lg('render with channel=1','rn');lg('effect: tune(1)','ef')}
if(a=='c'){if(!on)return lg('Mount the actor first.','rn');ch++;lg('render with channel='+ch,'rn');lg('cleanup: untune('+(ch-1)+')','cu');lg('effect: tune('+ch+')','ef')}
if(a=='u'){if(!on)return lg('Nothing is mounted.','rn');lg('cleanup: untune('+ch+')','cu');lg('component removed','rn');on=false;ch=0}
$('#state').textContent=on?'on stage, channel '+ch:'not on stage';seen.add(a);
if(seen.size==3&&!done){done=true;score+=50;answered++;head();burst(22);
$('#fb').innerHTML='<div class="fb ok"><b>Lesson learned! +50 pts. </b>Effect runs after render. On every change, the old cleanup runs first, then the new effect. On unmount only cleanup runs. That pairing is the whole lifecycle.</div><div class="row"><button class="go" id="nx">Start the show</button></div>';$('#nx').onclick=next}})}
function fin(){const p=score/MAX,s=p>.85?3:p>.6?2:1,r=['Understudy','Stage Manager','Lead Engineer'][s-1];
st.innerHTML='<div class="fin" style="text-align:center"><div class="stars">'+'★'.repeat(s)+'☆'.repeat(3-s)+'</div><h2 class="serif" style="font-size:1.8rem">Standing ovation!</h2><p>You finished with <b>'+score+'</b> of '+MAX+' points. Rank: <b>'+r+'</b></p></div><div class="fin"><b>Your interview cheat sheet</b><ul><li>An effect runs after render. What it returns is its cleanup.</li><li>Cleanup runs before the next effect and on unmount.</li><li>List every reactive value in the array. [] means once, no array means every render.</li><li>Stale closure? Use a functional update like setCount(c => c + 1).</li><li>Call hooks at the top level, never after an early return. Never pass an async function to useEffect.</li></ul></div><div class="row" style="justify-content:center"><button class="go" id="again">Play again</button></div>';
$('#again').onclick=()=>{L=0;Q=0;score=0;streak=0;answered=0;show()};burst(90,true);head()}
$('#begin').onclick=()=>{document.body.classList.add('open');show()};
head();
</script></body></html>
